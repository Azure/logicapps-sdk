parameters:
# true when the job runs under the OneBranch governed templates; false for 1ES templates.
- name: oneBranch
  type: boolean
  default: false
- name: sign
  type: boolean
  default: false

jobs:
- job: build
  displayName: Build

  ${{ if eq(parameters.oneBranch, true) }}:
    pool:
      type: windows

  variables:
  - name: pack_dir
    value: $(Build.ArtifactStagingDirectory)/pkg
  - name: pack_projects
    readonly: true
    value: |
        src\Microsoft.Azure.Workflows.Sdk.csproj
  - ${{ if eq(parameters.oneBranch, true) }}:
    - name: ob_outputDirectory
      value: $(pack_dir)
    # Consumed by eng/ci/nuget-publish.yml.
    - name: ob_artifactBaseName
      value: drop_packages
    - name: ob_sdl_codeql_compiled_enabled
      value: true

  ${{ if ne(parameters.oneBranch, true) }}:
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)
      outputs:
      - output: pipelineArtifact
        displayName: Publish packages
        path: $(pack_dir)
        artifact: drop_packages

  steps:
    - template: /eng/ci/templates/steps/install-dotnet.yml@self

    - task: DotNetCoreCLI@2
      displayName: Restore $(project)
      inputs:
        command: custom
        custom: restore
        projects: $(project)
        arguments: -v m --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json

    - task: DotNetCoreCLI@2
      displayName: Build $(project)
      inputs:
        command: build
        projects: $(project)
        arguments: -c $(configuration) -v m --no-restore

    - task: DotNetCoreCLI@2
      displayName: Test Microsoft.Azure.Workflows.Sdk.Tests
      inputs:
        command: test
        projects: tests/Microsoft.Azure.Workflows.Sdk.Tests/Microsoft.Azure.Workflows.Sdk.Tests.csproj
        arguments: -c $(configuration) -v m --no-build --no-restore

    - ${{ if eq(parameters.sign, true) }}:
      - task: onebranch.pipeline.signing@1
        displayName: Sign assemblies
        inputs:
          command: sign
          signing_profile: external_distribution
          search_root: $(Build.SourcesDirectory)/out/bin/src
          files_to_sign: '**/Microsoft.Azure.Workflows.Sdk*.dll'

    - task: DotNetCoreCLI@2
      displayName: Pack
      inputs:
        command: custom
        custom: pack
        arguments: -c $(configuration) -v m -o $(pack_dir) --no-build
        projects: $(pack_projects)

    - ${{ if eq(parameters.sign, true) }}:
      - task: onebranch.pipeline.signing@1
        displayName: Sign nuget packages
        inputs:
          command: sign
          cp_code: CP-401405
          search_root: $(pack_dir)
          files_to_sign: Microsoft.Azure.Workflows.Sdk*.nupkg

    - task: PowerShell@2
      displayName: Validate package-only C# workflow consumer
      inputs:
        targetType: filePath
        filePath: eng/Test-PackageConsumer.ps1
        arguments: '-PackageDirectory "$(pack_dir)"'
