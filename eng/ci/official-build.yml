parameters:
- name: sign
  displayName: Sign Files (release/* always signed)
  type: boolean
  default: true

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*

schedules:
# Ensure we build nightly to catch any new CVEs and report SDL often.
- cron: "0 3 * * *"
  displayName: Nightly Build
  branches:
    include:
    - main
    - release/*
  always: true

# CI only, does not trigger on PRs.
pr: none

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

variables:
- template: /eng/ci/templates/variables/build.yml@self
- name: WindowsContainerImage
  value: onebranch.azurecr.io/windows/ltsc2022/vse2022:latest
- name: sign
  readonly: true
  ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
    value: true
  ${{ else }}:
    value: ${{ parameters.sign }}

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      WindowsHostVersion:
        Version: 2022

    stages:
    - stage: Build
      jobs:
      - template: /eng/ci/templates/jobs/build.yml@self
        parameters:
          oneBranch: true
          sign: ${{ variables.sign }}
