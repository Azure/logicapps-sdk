trigger:
  batch: true
  branches:
    include:
    - main
    - release/*

schedules:
# Ensure we build nightly to catch any new CVEs and report SDL often.
- cron: "0 3 * * *"
  displayName: Nightly Build
  branches:
    include:
    - main
    - release/*
  always: true

# CI only, does not trigger on PRs.
pr: none

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

variables:
- template: /eng/ci/templates/variables/build.yml@self
- name: WindowsContainerImage
  value: onebranch.azurecr.io/windows/ltsc2025/vse2026:latest
- name: pack_dir
  value: $(Build.SourcesDirectory)\out\official-packages
- name: pack_projects
  value: |
    src\Microsoft.Azure.Workflows.Sdk.csproj

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    globalSdl:
      tsa:
        enabled: false

    featureFlags:
      WindowsHostVersion:
        Version: 2025
      EnableCDPxPAT: false

    stages:
    - stage: Build
      jobs:
      - job: Build
        displayName: Build
        pool:
          type: windows

        variables:
          ob_outputDirectory: $(pack_dir)
          ob_artifactBaseName: drop_packages

        steps:
        - template: /eng/ci/templates/steps/install-dotnet.yml@self

        - task: DotNetCoreCLI@2
          displayName: Restore $(project)
          inputs:
            command: custom
            custom: restore
            projects: $(project)
            arguments: -v m --configfile $(Build.SourcesDirectory)\NuGet.Config

        - task: DotNetCoreCLI@2
          displayName: Build $(project)
          inputs:
            command: build
            projects: $(project)
            arguments: -c $(configuration) -v m --no-restore

        - task: DotNetCoreCLI@2
          displayName: Test Microsoft.Azure.Workflows.Sdk.Tests
          inputs:
            command: test
            projects: tests/Microsoft.Azure.Workflows.Sdk.Tests/Microsoft.Azure.Workflows.Sdk.Tests.csproj
            publishTestResults: false
            arguments: -c $(configuration) -v m --no-build --no-restore --logger trx --results-directory "$(Agent.TempDirectory)"

        - task: PublishTestResults@2
          displayName: Publish test results
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: '*.trx'
            searchFolder: $(Agent.TempDirectory)
            mergeTestResults: true
            failTaskOnFailedTests: true

        - task: onebranch.pipeline.signing@1
          displayName: Sign assemblies
          inputs:
            command: sign
            signing_profile: external_distribution
            search_root: $(Build.SourcesDirectory)\out\bin\src
            files_to_sign: '**/Microsoft.Azure.Workflows.Sdk*.dll'

        - task: DotNetCoreCLI@2
          displayName: Pack
          inputs:
            command: custom
            custom: pack
            arguments: -c $(configuration) -v m -o $(pack_dir) --no-build
            projects: $(pack_projects)

        - task: onebranch.pipeline.signing@1
          displayName: Sign NuGet packages
          inputs:
            command: sign
            signing_profile: external_distribution
            search_root: $(pack_dir)
            files_to_sign: Microsoft.Azure.Workflows.Sdk*.nupkg

        - task: PowerShell@2
          displayName: Validate package-only C# workflow consumer
          inputs:
            targetType: filePath
            filePath: eng/Test-PackageConsumer.ps1
            arguments: '-PackageDirectory "$(pack_dir)"'
